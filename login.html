<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HM-academy - تسجيل الدخول</title>
  <!-- استدعاء خطوط وأيقونات عصرية -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(at 10% 20%, rgba(14, 165, 233, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* خلفية متحركة جمالية */
    .bg-shapes div {
      position: absolute;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.4;
      animation: float 10s infinite alternate;
    }
    .shape-1 {
      top: -10%;
      right: -10%;
      width: 350px;
      height: 350px;
      background: #0284c7;
      border-radius: 50%;
    }
    .shape-2 {
      bottom: -10%;
      left: -10%;
      width: 350px;
      height: 350px;
      background: #7c3aed;
      border-radius: 50%;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(20px) scale(1.05); }
    }

    /* بطاقة الدخول بتأثير الزجاج */
    .login-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 45px 35px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-icon {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      color: #fff;
      box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
    }

    .login-card h2 {
      margin-bottom: 8px;
      color: #f8fafc;
      font-size: 1.7rem;
      font-weight: 700;
    }

    .login-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: right;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    /* الأيقونة اليمنى (قفل أو إيميل) */
    .input-wrapper > i:first-of-type {
      position: absolute;
      right: 14px;
      color: #64748b;
      pointer-events: none;
      transition: color 0.3s;
    }

    .form-group input {
      width: 100%;
      padding: 13px 42px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(15, 23, 42, 0.6);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #38bdf8;
      background-color: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .form-group input:focus ~ i:first-of-type {
      color: #38bdf8;
    }

    /* أيقونة إظهار/إخفاء كلمة المرور اليسرى */
    .toggle-password {
      position: absolute;
      left: 14px;
      cursor: pointer;
      color: #64748b;
      z-index: 5;
      transition: color 0.3s;
      padding: 5px;
    }
    .toggle-password:hover {
      color: #cbd5e1;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-login:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error-msg {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="bg-shapes">
    <div class="shape-1"></div>
    <div class="shape-2"></div>
  </div>

  <div class="login-card">
    <div class="brand-icon">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <h2>أكاديمية HM</h2>
    <p>تسجيل الدخول إلى المنصة التعليمية</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="example@domain.com" autocomplete="email" required>
          <i class="fa-regular fa-envelope"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <i class="fa-solid fa-lock"></i>
          <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        <span>تسجيل الدخول</span>
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </button>
      
      <div id="errorText" class="error-msg"></div>
    </form>
  </div>

  <!-- سكربت الاتصال بقاعدة بيانات Supabase ونظام المصادقة -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // ضع بيانات مشروعك هنا
    const SUPABASE_URL = 'https://lmlvftoslssbwnoahgxh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_0Jltboo6CsmJRLntCtlysw_SltMc7Tb';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const errorText = document.getElementById('errorText');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    // تفعيل زر إظهار وإخفاء كلمة المرور
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        errorText.style.display = 'block';
        errorText.innerText = "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
        return;
      }

      errorText.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        window.location.replace("index.html");

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>تسجيل الدخول</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
        errorText.style.display = 'block';
        errorText.innerText = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
      }
    });
  </script>
</body>
</html>
