<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HM-Academy | تسجيل الدخول</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- خلفية تفاعلية بلمسات تدرج ناعم -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>
  </div>

  <!-- كارت تسجيل الدخول -->
  <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl animate-fade-in relative z-10">
    
    <!-- الشعار والترويسة -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-violet-500 mb-4 shadow-lg shadow-indigo-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">HM-Academy</h1>
      <p class="text-slate-400 text-sm mt-1">مرحباً بك، يرجى تسجيل الدخول للمتابعة</p>
    </div>

    <!-- رسائل الخطأ والتنبيهات -->
    <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm transition-all duration-300"></div>

    <!-- نموذج الدخول -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-300 mb-2">اسم المستخدم</label>
        <div class="relative">
          <input type="text" id="username" required placeholder="أدخل اسم المستخدم"
            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition text-slate-100 placeholder-slate-500 text-sm">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">كلمة المرور</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition text-slate-100 placeholder-slate-500 text-sm">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-medium rounded-xl shadow-lg shadow-indigo-600/25 transition-all duration-200 flex items-center justify-center">
        <span>تسجيل الدخول</span>
      </button>
    </form>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
   // إعدادات مشروع HM-Academy
    const firebaseConfig = {
      apiKey: "AIzaSyAUdwLuk9aSRN3V-3tEvksSicP8rcivsM8",
      authDomain: "hm-academy.firebaseapp.com",
      projectId: "hm-academy",
      storageBucket: "hm-academy.firebasestorage.app",
      messagingSenderId: "629027258286",
      appId: "1:629027258286:web:9422a116b64a6ed1c2923f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const loginForm = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    function showAlert(message, type = "error") {
      alertBox.classList.remove("hidden", "bg-red-500/10", "text-red-400", "border-red-500/20", "bg-emerald-500/10", "text-emerald-400", "border-emerald-500/20");
      if (type === "error") {
        alertBox.classList.add("bg-red-500/10", "text-red-400", "border", "border-red-500/20");
      } else {
        alertBox.classList.add("bg-emerald-500/10", "text-emerald-400", "border", "border-emerald-500/20");
      }
      alertBox.textContent = message;
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = 
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        جاري التحقق...
      ;

      try {
        // البحث عن المستند الذي يطابق اسم المستخدم في مجموعة "users"
        const usersRef = collection(db, "users");
        const q = query(usersRef, where("username", "==", usernameInput));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          showAlert("اسم المستخدم أو كلمة المرور غير صحيحة");
        } else {
          let userFound = false;
          querySnapshot.forEach((doc) => {
            const userData = doc.data();
            
            // التحقق من كلمة المرور
            if (userData.password === passwordInput) {
              userFound = true;
              showAlert("تم تسجيل الدخول بنجاح! جاري التوجيه...", "success");

              // التوجيه حسب الدور (Role)
              setTimeout(() => {
                if (userData.role === "admin") {
                  window.location.href = "admin.html";
                } else {
                  window.location.href = "index.html";
                }
              }, 1200);
            }
          });

          if (!userFound) {
            showAlert("اسم المستخدم أو كلمة المرور غير صحيحة");
          }
        }
      } catch (error) {
        console.error(error);
        showAlert("حدث خطأ أثناء الاتصال بقاعدة البيانات. الرجاء المحاولة لاحقاً.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
