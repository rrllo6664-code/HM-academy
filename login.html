<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HM-academy - تسجيل الدخول</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1e293b; color: white; margin: 0; }
    .card { background: #334155; padding: 30px; border-radius: 12px; width: 300px; display: flex; flex-direction: column; gap: 12px; }
    input, button { padding: 10px; border-radius: 6px; border: none; outline: none; }
    button { background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #2563eb; }
    .btn-alt { background: #475569; }
  </style>
</head>
<body>

  <div class="card">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" />
    <input type="password" id="password" placeholder="كلمة المرور" />
    <button onclick="handleLogin()">تسجيل الدخول</button>
    <button class="btn-alt" onclick="handleRegister()">إنشاء حساب جديد</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // إعدادات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyAUDwLuk9aSRN3V-3tEvkSScP8rcivsM8",
      authDomain: "hm-academy.firebaseapp.com",
      projectId: "hm-academy",
      storageBucket: "hm-academy.firebasestorage.app",
      messagingSenderId: "629027258286",
      appId: "1:629027258286:web:9422a116b64a6ed1c2923f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("تم تسجيل الدخول بنجاح!");
          window.location.href = "index.html";
        })
        .catch(err => alert("خطأ: " + err.message));
    };

    window.handleRegister = function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("تم إنشاء الحساب بنجاح!");
          window.location.href = "index.html";
        })
        .catch(err => alert("خطأ: " + err.message));
    };
  </script>
</body>
</html>
