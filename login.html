<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HM-academy - تسجيل الدخول</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background-color: rgba(30, 41, 59, 0.95);
      border: 1px solid #334155;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .login-card h2 {
      margin-bottom: 8px;
      color: #38bdf8;
      font-size: 1.6rem;
    }
    .login-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: right;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #38bdf8;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .btn-login:hover {
      background-color: #0369a1;
    }
    .btn-login:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 15px;
      display: none;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>أكاديمية HM</h2>
    <p>تسجيل الدخول إلى المنصة التعليمية</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@domain.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">تسجيل الدخول</button>
      <div id="errorText" class="error-msg"></div>
    </form>
  </div>

  }<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyAUdwLuk9aSRN3V-3tEvksSicP8rcivsM8",
  authDomain: "hm-academy.firebaseapp.com",
  projectId: "hm-academy",
  storageBucket: "hm-academy.firebasestorage.app",
  messagingSenderId: "629027258286",
  appId: "1:629027258286:web:9422a116b64a6ed1c2923f"
};
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // تحديد بريد ناشر المحتوى / المسؤول
  const ADMIN_EMAIL = "rrllo6664@gmail.com"; 

  const loginForm = document.getElementById('loginForm');
  const errorText = document.getElementById('errorText');
  const submitBtn = document.getElementById('submitBtn');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      errorText.style.display = 'block';
      errorText.innerText = "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
      return;
    }

    errorText.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerText = 'جاري التحقق...';

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // التوجيه الذكي حسب نوع البريد الإلكتروني
      if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        alert("أهلاً بك يا ناشر المحتوى! جاري التوجيه للوحة التحكم...");
        window.location.replace("admin.html"); // صفحة إضافة ونشر المحتوى
      } else {
        alert("تم تسجيل الدخول بنجاح!");
        window.location.replace("index.html"); // صفحة الطلاب والدروس
      }

    } catch (error) {
      submitBtn.disabled = false;
      submitBtn.innerText = 'تسجيل الدخول';
      errorText.style.display = 'block';

      if (error.code === 'auth/network-request-failed') {
        errorText.innerText = "فشل الاتصال بالسيرفر. يرجى التأكد من تشغيل VPN أو استقرار الإنترنت.";
      } else if (
        error.code === 'auth/invalid-credential' || 
        error.code === 'auth/user-not-found' || 
        error.code === 'auth/wrong-password'
      ) {
        errorText.innerText = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
      } else {
        errorText.innerText = "حدث خطأ: " + error.message;
      }
    }
  });
</script>
</body>
</html>
