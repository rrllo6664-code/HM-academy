<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة H.m التعليمية - عرض الدروس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Animations Keyframes --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* Header Navigation */
        .navbar {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: fadeIn 0.6s ease-out;
        }

        .navbar .brand {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .navbar .brand:hover {
            transform: scale(1.03);
        }

        .navbar .logout-btn {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .navbar .logout-btn:hover {
            background: #ef4444;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* Layout Grid */
        .main-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 30px;
            flex-grow: 1;
        }

        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; }
        }

        /* Player Section */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .video-wrapper:hover {
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.15);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            animation: fadeIn 0.5s ease;
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            background-color: var(--bg-card);
            gap: 15px;
        }

        .video-placeholder svg {
            width: 64px;
            height: 64px;
            fill: var(--primary);
            animation: pulseGlow 2s infinite;
            border-radius: 50%;
        }

        .video-details {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .video-details h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .video-details p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 0.98rem;
        }

        /* Playlist Section */
        .playlist-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            max-height: 750px;
            animation: slideInRight 0.8s ease-out;
        }

        .playlist-header {
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-header span {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .lessons-scroll {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .lesson-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .lesson-card:hover {
            border-color: var(--primary);
            transform: translateX(-6px) scale(1.01);
            background-color: rgba(30, 41, 59, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .lesson-card.active {
            border-color: var(--primary);
            background-color: rgba(56, 189, 248, 0.12);
            box-shadow: inset 4px 0 0 var(--primary);
        }

        .lesson-card .play-icon {
            width: 24px;
            height: 24px;
            fill: var(--primary);
            flex-shrink: 0;
            margin-top: 2px;
            transition: transform 0.3s ease;
        }

        .lesson-card:hover .play-icon {
            transform: scale(1.2);
        }

        .lesson-card-info h4 {
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .lesson-card-info p {
            font-size: 0.82rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand">منصة H.m التعليمية</a>
        <button onclick="logoutStudent()" class="logout-btn">تسجيل الخروج 🚪</button>
    </header>

    <div class="main-container">
        <main class="video-section">
            <div class="video-wrapper">
                <div class="video-placeholder" id="placeholder">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <p>اختر درساً من القائمة لبدء المشاهدة</p>
                </div>
                <iframe id="mainVideoPlayer" src="" allowfullscreen style="display: none;"></iframe>
            </div>

            <div class="video-details" id="videoDetailsBox">
                <h2 id="currentVideoTitle">مرحباً بك في المنصة</h2>
                <p id="currentVideoDesc">اختر أي درس من قائمة الدروس المتاحة على يسار الشاشة ليتم تشغيل الفيديو واستعراض تفاصيله.</p>
            </div>
        </main>

        <aside class="playlist-section">
            <div class="playlist-header">
                <h3>قائمة الدروس</h3>
                <span id="lessonCountBadge">0 دروس</span>
            </div>

            <div class="lessons-scroll" id="studentLessonsList"></div>
        </aside>
    </div>

    <footer>
        &copy; 2026 منصة H.m التعليمية - جميع الحقوق محفوظة.
    </footer>

    <!-- ربط Supabase والتحقق من الجلسة الحقيقية -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // استبدل بنفس معلومات Supabase التي وضعتها في صفحة Login.html
        const SUPABASE_URL = 'https://lmlvftoslssbwnoahgxh.supabase.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0Jltboo6CsmJRLntCtlysw_SltMc7Tb';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // التحقق من الحماية: هل المستخدم مسجل دخول عبر Supabase؟
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.replace("Login.html");
            }
        }
        checkAuth();

        // دالة تسجيل الخروج المتوافقة مع Supabase
        window.logoutStudent = async function() {
            await supabase.auth.signOut();
            window.location.replace("Login.html");
        }
    </script>

    <script>
        function getLessons() {
            var saved = localStorage.getItem("h_m_lessons");
            if (saved) {
                try { return JSON.parse(saved); } catch(e) { return []; }
            }
            return [];
        }

        function playLesson(lesson, element) {
            var iframe = document.getElementById('mainVideoPlayer');
            var placeholder = document.getElementById('placeholder');
            var titleEl = document.getElementById('currentVideoTitle');
            var descEl = document.getElementById('currentVideoDesc');
            var detailsBox = document.getElementById('videoDetailsBox');

            iframe.style.display = 'none';
            iframe.src = lesson.url;
            iframe.style.display = 'block';
            placeholder.style.display = 'none';

            detailsBox.style.opacity = '0';
            setTimeout(function() {
                titleEl.textContent = lesson.title;
                descEl.textContent = lesson.desc;
                detailsBox.style.opacity = '1';
            }, 200);

            var allCards = document.querySelectorAll('.lesson-card');
            allCards.forEach(function(card) { card.classList.remove('active'); });
            if (element) { element.classList.add('active'); }
        }

        document.addEventListener('DOMContentLoaded', function() {
            var lessons = getLessons();
            var listContainer = document.getElementById('studentLessonsList');
            var badge = document.getElementById('lessonCountBadge');

            badge.textContent = lessons.length + " درس";

            if (lessons.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 40px;">لا توجد دروس منشورة حالياً.</div>';
                return;
            }

            lessons.forEach(function(lesson, index) {
                var card = document.createElement('div');
                card.className = 'lesson-card';
                card.style.animationDelay = (index * 0.1) + 's';
                card.innerHTML = '<svg class="play-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>' +
                    '<div class="lesson-card-info">' +
                        '<h4>' + lesson.title + '</h4>' +
                        '<p>' + lesson.desc + '</p>' +
                    '</div>';

                card.addEventListener('click', function() {
                    playLesson(lesson, card);
                });

                listContainer.appendChild(card);

                if (index === 0) {
                    playLesson(lesson, card);
                }
            });
        });
    </script>
</body>
</html>
