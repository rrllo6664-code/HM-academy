<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HM Academy - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-deep:       #070D1A;
      --card-bg:       rgba(12, 22, 48, 0.65);
      --card-border:   rgba(90, 130, 255, 0.14);
      --accent:        #6C8EF5;
      --accent-glow:   rgba(108, 142, 245, 0.38);
      --text-primary:  #E8EEFF;
      --text-muted:    #7B8DB0;
      --input-bg:      rgba(8, 15, 36, 0.85);
      --input-border:  rgba(70, 100, 200, 0.22);
      --error:         #FF6B7A;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .bg-canvas { position: fixed; inset: 0; z-index: 0; }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.3;
      animation: floatOrb linear infinite;
    }
    .orb-1 {
      width: 550px; height: 550px;
      background: radial-gradient(circle, #1a2f88, transparent);
      top: -140px; left: -120px;
      animation-duration: 28s;
    }
    .orb-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #0d3070, transparent);
      bottom: -100px; right: -90px;
      animation-duration: 34s;
      animation-delay: -12s;
    }
    .orb-3 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #291f80, transparent);
      top: 45%; left: 58%;
      animation-duration: 22s;
      animation-delay: -6s;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(28px, -38px) scale(1.04); }
      50%  { transform: translate(-18px, 28px) scale(0.96); }
      75%  { transform: translate(38px, 8px)  scale(1.02); }
    }

    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.08; transform: scale(1); }
      50%       { opacity: 0.55; transform: scale(1.4); }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 430px;
      animation: cardUp 0.75s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }
    @keyframes cardUp {
      from { opacity: 0; transform: translateY(44px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 66px; height: 66px;
      margin: 0 auto 14px;
      background: linear-gradient(140deg, #3455c8, #6C8EF5);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(108,142,245,0.35);
      animation: logoPulse 3.2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 30px rgba(108,142,245,0.35); }
      50%       { box-shadow: 0 8px 48px rgba(108,142,245,0.62); }
    }
    .logo-icon svg { width: 32px; height: 32px; fill: #fff; }

    .logo-name { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.3px; }
    .logo-name .hm { color: var(--accent); }

    .logo-tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 300;
    }
   .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 40px 36px 36px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow:
        0 4px 28px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .card-heading   { font-size: 1.1rem; font-weight: 600; }
    .card-sub       { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; margin-bottom: 26px; font-weight: 300; }

    .divider {
      height: 1px;
      background: linear-gradient(to left, transparent, var(--card-border), transparent);
      margin-bottom: 26px;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 7px;
      font-weight: 500;
    }

    .input-wrap { position: relative; }

    .input-wrap .i-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.22s;
    }

    .form-group input {
      width: 100%;
      padding: 13px 46px 13px 46px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 13px;
      color: var(--text-primary);
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .form-group input::placeholder { color: rgba(123,141,176,0.38); }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .input-wrap:focus-within .i-icon { color: var(--accent); }

    .toggle-pwd {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      line-height: 0;
      transition: color 0.2s;
    }
    .toggle-pwd:hover { color: var(--accent); }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(140deg, #3455c8, #6C8EF5);
      color: #fff;
      border: none;
      border-radius: 13px;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      position: relative;
      overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 4px 22px rgba(108,142,245,0.32);
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,142,245,0.48); }
    .btn-submit:disabled              { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      color: var(--error);
      font-size: 0.82rem;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(255,107,122,0.08);
      border: 1px solid rgba(255,107,122,0.22);
      border-radius: 11px;
    }
    .error-msg.visible { display: flex; }

    .card-footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.76rem;
      color: rgba(123,141,176,0.45);
    }
  </style>
  <link rel="stylesheet" href="site.css">
</head>
<body class="login-page">
  <a class="back-home" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    العودة إلى الدروس
  </a>
  <main class="container">
    <section class="login-visual" aria-label="عن منصة H.M التعليمية">
      <a class="brand-lockup" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M8 7h8M8 11h7"/></svg>
        </span>
        <span>H.M Academy<span class="brand-caption">منصة تعليمية عربية</span></span>
      </a>
      <div class="login-visual-content">
        <p class="visual-kicker">خطوتك التالية تبدأ هنا</p>
        <h1>تعلّم اليوم،<br>واصنع فرق الغد.</h1>
        <p>دروس واضحة ومحتوى تعليمي يساعدك على التقدّم خطوة بعد خطوة.</p>
      </div>
      <div class="visual-footnote">مساحة تجمع بين المعرفة والتعلّم المستمر.</div>
    </section>

    <section class="login-panel" aria-labelledby="loginHeading">
      <header class="login-panel-heading">
        <p class="eyebrow" id="loginAudience">مساحة المتعلمين</p>
        <h2 id="loginHeading">أهلاً بعودتك</h2>
        <p id="loginSubtitle">سجّل دخولك للمتابعة إلى حسابك.</p>
      </header>
      <div class="login-mode-switch" role="group" aria-label="اختيار نوع الدخول">
        <button type="button" class="mode-tab active" data-login-mode="student" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          دخول الطالب
        </button>
        <button type="button" class="mode-tab" data-login-mode="teacher" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 10 10-5 10 5-10 5-10-5Z"/><path d="M6 12v5c3.5 3 8.5 3 12 0v-5M22 10v6"/></svg>
          دخول الأستاذ
        </button>
      </div>
      <div class="card">
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <div class="input-wrap">
              <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
              <span class="i-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <div class="input-wrap">
              <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
              <span class="i-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <button type="button" class="toggle-pwd" id="togglePwd" aria-label="إظهار أو إخفاء كلمة المرور" title="إظهار أو إخفاء كلمة المرور">
                <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">تسجيل الدخول</button>
          <div id="errorBox" class="error-msg" role="alert"><span id="errorMsg"></span></div>
          <button type="button" class="signup-action" id="signupBtn">إنشاء حساب طالب جديد</button>
        </form>
      </div>
      <p class="card-footer">© 2026 H.M Academy</p>
    </section>
  </main>

  <script>
    const pwdInput  = document.getElementById('password');
    const eyeIcon   = document.getElementById('eyeIcon');
    document.getElementById('togglePwd').addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      eyeIcon.innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });
  </script>
      <script type="module">
    import { supabase } from "./supabase.js";

    const form      = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox  = document.getElementById('errorBox');
    const errorMsg  = document.getElementById('errorMsg');
    const loginAudience = document.getElementById('loginAudience');
    const loginHeading = document.getElementById('loginHeading');
    const loginSubtitle = document.getElementById('loginSubtitle');
    const signupBtn = document.getElementById('signupBtn');
    let loginMode = 'student';
    let createAccount = false;

    document.querySelectorAll('[data-login-mode]').forEach((button) => {
      button.addEventListener('click', () => {
        loginMode = button.dataset.loginMode;
        document.querySelectorAll('[data-login-mode]').forEach((modeButton) => {
          const selected = modeButton === button;
          modeButton.classList.toggle('active', selected);
          modeButton.setAttribute('aria-pressed', String(selected));
        });

        const teacherMode = loginMode === 'teacher';
        createAccount = false;
        signupBtn.hidden = teacherMode;
        signupBtn.textContent = 'إنشاء حساب طالب جديد';
        submitBtn.textContent = teacherMode ? 'الدخول إلى لوحة الأستاذ' : 'تسجيل الدخول';
        loginAudience.textContent = teacherMode ? 'مساحة الأستاذ' : 'مساحة المتعلمين';
        loginHeading.textContent = teacherMode ? 'دخول الأستاذ' : 'أهلاً بعودتك';
        loginSubtitle.textContent = teacherMode
          ? 'سجّل الدخول بحساب الأستاذ للوصول إلى لوحة الإدارة.'
          : 'سجّل دخولك للمتابعة إلى حسابك.';
        hideError();
      });
    });

    signupBtn.addEventListener('click', () => {
      createAccount = !createAccount;
      loginAudience.textContent = createAccount ? 'حساب طالب جديد' : 'مساحة المتعلمين';
      loginHeading.textContent = createAccount ? 'أنشئ حسابك' : 'أهلاً بعودتك';
      loginSubtitle.textContent = createAccount
        ? 'أنشئ حساباً للبدء، ثم أكمل بياناتك عند دخول المنصة.'
        : 'سجّل دخولك للمتابعة إلى حسابك.';
      submitBtn.textContent = createAccount ? 'إنشاء الحساب' : 'تسجيل الدخول';
      signupBtn.textContent = createAccount ? 'لديك حساب؟ تسجيل الدخول' : 'إنشاء حساب طالب جديد';
      hideError();
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.classList.add('visible');
    }
    function hideError() { errorBox.classList.remove('visible'); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
        return;
      }
      if (createAccount && password.length < 8) {
        showError("يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.");
        return;
      }

      hideError();
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'جاري التحقق... <span class="spinner"></span>';

      try {
        if (createAccount) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: new URL('Login.html', window.location.href).href }
          });
          if (error) throw error;
          if (data.session) {
            window.location.replace("index.html");
            return;
          }
          submitBtn.disabled = false;
          submitBtn.textContent = 'إنشاء الحساب';
          showError("تم إنشاء الحساب. راجع بريدك لتأكيده، ثم سجّل الدخول.");
          return;
        }

        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (authError) throw authError;

        const { data: profileData, error: profileError } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', authData.user.id)
          .maybeSingle();

        if (profileError) throw profileError;

        const userRole = profileData ? profileData.role : 'student';

        if (loginMode === 'teacher' && userRole !== 'admin') {
          await supabase.auth.signOut();
          throw new Error("هذا الحساب لا يملك صلاحية الأستاذ بعد.");
        }

        if (userRole === 'admin') {
          window.location.replace("admin.html");
        } else {
          window.location.replace("index.html");
        }

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = createAccount ? 'إنشاء الحساب' : (loginMode === 'teacher' ? 'الدخول إلى لوحة الأستاذ' : 'تسجيل الدخول');
        showError(error.message || "حدث خطأ أثناء تسجيل الدخول.");
      }
    });
  </script>
</body>
</html>
